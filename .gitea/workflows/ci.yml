# 📄 Dosya Yolu: .gitea/workflows/ci.yml
# 📌 Amac: Gitea Actions uzerinde Desktop ve OpenCart modullerini otomatik dogrulamak
# 📌 Modul - FileType
# Version: 0.1.61
# Aciklama: Java 21 Maven verify, PHP lint ve OCMOD paket kontrolu
# Bagimli Oldugu Katman: Tool | Config

name: UniZip Monorepo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Maven Verify
        run: mvn -B clean verify

      - name: PHP Syntax Check
        shell: bash
        run: find extensions/opencart/turkuaz-entitlement-api/upload -name '*.php' -type f -print0 | xargs -0 -n1 php -l

      - name: Build OCMOD Package
        run: python3 scripts/build-opencart-extension.py
