# 📄 Dosya Yolu: .github/workflows/release-package.yml
# 📌 Amac: UniZip tag yayinlarinda Desktop portable paket, update manifest ve OpenCart OCMOD uretmek
# 📌 Modul - FileType
# Version: 0.3.2
# Aciklama: Maven build, ZIP paket, SHA-256 manifest ve OCMOD artifact pipeline tanimi
# Bagimli Oldugu Katman: Tool | Config

name: UniZip Release Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve Versions
        shell: pwsh
        run: |
          $desktopVersion = (Get-Content version.txt -Raw).Trim()
          $extensionVersion = Get-Content extensions/opencart/turkuaz-entitlement-api/version.txt |
            Where-Object { $_.Trim() -match '^[0-9]+\.[0-9]+\.[0-9]+$' } |
            Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($extensionVersion)) {
            throw "OpenCart eklenti surumu bulunamadi"
          }
          "UNIZIP_VERSION=$desktopVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ENTITLEMENT_VERSION=$extensionVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build And Test Desktop
        run: mvn -B clean verify dependency:copy-dependencies -pl apps/desktop -DincludeScope=runtime -DoutputDirectory=target/lib

      - name: Build Portable Directory
        shell: pwsh
        run: |
          $dist = "dist/UniZip_v${env:UNIZIP_VERSION}_portable"
          New-Item -ItemType Directory -Force -Path "$dist/lib" | Out-Null
          Copy-Item "apps/desktop/target/unizip-desktop-${env:UNIZIP_VERSION}.jar" "$dist/UniZip.jar"
          Copy-Item "apps/desktop/target/lib/*" "$dist/lib/"
          Copy-Item "LICENSE" "$dist/LICENSE"
          @'
          @echo off
          REM # 📄 Dosya Yolu: UniZip.bat
          REM # 📌 Amac: UniZip portable Java uygulamasini baslatmak
          REM # 📌 Modul - FileType
          REM Version: 0.1.61
          REM Aciklama: Java 21 classpath ile UniZip Desktop baslatir
          java -cp "UniZip.jar;lib/*" com.unizip.desktop.MainApp %*
          '@ | Set-Content "$dist/UniZip.bat" -Encoding ASCII
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/UniZip_v${env:UNIZIP_VERSION}_portable.zip" -Force

      # @dev-id UNIZIP-TI-SETUP-001
      # TurkuazInstaller Community engine must remain fixed to reviewed source.
      - name: Checkout pinned TurkuazInstaller v0.2.24
        uses: actions/checkout@v4
        with:
          repository: TurkuazLabs/TurkuazInstaller
          ref: 10101dee8b6efe4775f5cf72aa05f3a3da934bfa
          path: turkuaz-installer-source
          persist-credentials: false

      # GUI-subsystem EXE is only an embedding stub. A console-subsystem
      # binary must run build-package/build-native-setup so pwsh can await exit.
      - name: Build TurkuazInstaller GUI stub and console CLI
        shell: pwsh
        run: |
          $manifest = 'turkuaz-installer-source/rust/Cargo.toml'
          $bin = 'turkuaz-installer-source/rust/target/release/turkuaz-installer.exe'
          $stub = 'turkuaz-installer-source/rust/target/release/turkuaz-installer-studio.exe'
          cargo build --locked --manifest-path $manifest -p turkuaz-installer-cli --release --bin turkuaz-installer --features setup-authoring-gui
          if ($LASTEXITCODE -ne 0) { throw 'TurkuazInstaller GUI build failed.' }
          Copy-Item -LiteralPath $bin -Destination $stub -Force
          cargo build --locked --manifest-path $manifest -p turkuaz-installer-cli --release --bin turkuaz-installer --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'TurkuazInstaller console CLI build failed.' }
          if (-not (Test-Path -LiteralPath $stub -PathType Leaf)) { throw 'GUI stub missing.' }

      - name: Build UniZip native setup
        shell: pwsh
        run: |
          $Version = $env:UNIZIP_VERSION
          $Cli = 'turkuaz-installer-source/rust/target/release/turkuaz-installer.exe'
          $Source = Join-Path $PWD ('dist/UniZip_v' + $Version + '_portable')
          $Target = Join-Path $PWD 'dist/installer'
          New-Item -ItemType Directory -Force -Path $Target | Out-Null
          $Package = Join-Path $Target ('UniZip-' + $Version + '.tzpkg')
          $Setup = Join-Path $Target ('UniZip-Setup-' + $Version + '.exe')
          & $Cli build-package --package-id com.turkuazlabs.unizip --version $Version --source $Source --output $Package
          if ($LASTEXITCODE -ne 0) { throw 'UniZip .tzpkg build failed.' }
          & $Cli build-native-setup --stub 'turkuaz-installer-source/rust/target/release/turkuaz-installer-studio.exe' --package $Package --output $Setup
          if ($LASTEXITCODE -ne 0) { throw 'UniZip native Setup build failed.' }
          $files = @($Package, $Setup)
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing installer artifact: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath (Join-Path $Target 'SHA256SUMS.txt') -Encoding ascii

      - name: Generate Update Manifest
        shell: pwsh
        run: |
          $asset = "UniZip_v${env:UNIZIP_VERSION}_portable.zip"
          $url = "https://unizip.turkuaz.com/releases/stable/$asset"
          python scripts/generate-update-manifest.py --file "dist/$asset" --version "$env:UNIZIP_VERSION" --download-url "$url" --output "dist/update.yml" --published-at "${{ github.event.head_commit.timestamp }}" --notes "UniZip stable release"

      - name: Build OpenCart OCMOD
        run: python scripts/build-opencart-extension.py

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unizip-release-${{ env.UNIZIP_VERSION }}
          path: |
            dist/UniZip_v${{ env.UNIZIP_VERSION }}_portable.zip
            dist/update.yml
            dist/turkuaz_entitlement_api_v${{ env.ENTITLEMENT_VERSION }}_oc3.ocmod.zip
            dist/installer/UniZip-${{ env.UNIZIP_VERSION }}.tzpkg
            dist/installer/UniZip-Setup-${{ env.UNIZIP_VERSION }}.exe
            dist/installer/SHA256SUMS.txt
