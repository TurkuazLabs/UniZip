# 📄 Dosya Yolu: .github/workflows/ci.yml
# 📌 Amac: GitHub uzerinde Desktop ve OpenCart modullerini otomatik dogrulamak
# 📌 Modul - FileType
# Version: 0.1.61
# Aciklama: Java 21 Maven verify, PHP lint ve OCMOD artifact pipeline tanimi
# Bagimli Oldugu Katman: Tool | Config

name: UniZip Monorepo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  desktop-ci:
    name: Desktop Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Verify
        run: mvn -B clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unizip-test-reports
          path: apps/desktop/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload Desktop Jar
        uses: actions/upload-artifact@v4
        with:
          name: unizip-desktop-jar
          path: apps/desktop/target/*.jar

  opencart-ci:
    name: OpenCart Extension Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: PHP Syntax Check
        shell: bash
        run: find extensions/opencart/turkuaz-entitlement-api/upload -name '*.php' -type f -print0 | xargs -0 -n1 php -l

      - name: Build OCMOD Package
        run: python3 scripts/build-opencart-extension.py

      - name: Upload OCMOD Package
        uses: actions/upload-artifact@v4
        with:
          name: turkuaz-entitlement-api-ocmod
          path: dist/*.ocmod.zip
